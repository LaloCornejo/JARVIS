jarvis:
  name: "JARVIS"
  wake_word: "hey jarvis"
  timezone: "America/Mexico_City"

llm:
  backend: omniroute
  temperature: 0.7
  stream: true
  primary_model: null # Will use backend-specific primary model
  fast_model: null # Will use backend-specific fast model
  vision_model: null # Will use backend-specific vision model
  fallback_model: null # Will use backend-specific fallback model
  # Per-model backend override
  primary_backend: omniroute
  fast_backend: omniroute
  vision_backend: llamacpp

ollama:
