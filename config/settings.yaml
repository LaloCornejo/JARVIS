voice_input:
  stt_backend: faster-whisper
  model: tiny.en
  device: cuda
  compute_type: float16
  vad: silero
  silence_duration: 0.5
  input_device: null
  startup_enabled: true

proactive:
  quiet_hours_start: 23 # hour (24h format)
  quiet_hours_end: 7 # hour (24h format)

tts:
  engine: xtts # "xtts", "supertonic", or "mosstts_nano"

  # Shared
  language: en

  # XTTS-specific (used when engine: xtts)
  xtts:
    base_url: http://localhost:8020
    speaker: duckie
    sample_rate: 24000

  # Supertonic-specific (used when engine: supertonic)
  # Install: pip install supertonic
  # Docs:    https://supertone-inc.github.io/supertonic-py/
  supertonic:
    voice: M1 # Built-in: M1-M5 (male), F1-F5 (female)
    custom_voice_path: null # Path to Voice Builder JSON export (overrides voice)
    speed: 1.05 # 0.7 (slow) to 2.0 (fast)
    steps: 8 # 5 (low quality) to 12 (high quality)

  # MOSS-TTS-Nano-specific (used when engine: mosstts_nano)
  # Uses ONNX CPU runtime (no PyTorch/torchcodec needed).
  # Models auto-download from HuggingFace on first use.
  mosstts_nano:
    voice: "Ava" # Built-in preset (see get_speakers)
    prompt_audio_path: 'C:\Users\Lalo\Documents\Code\JARVIS\reference.wav' # zero-shot voice clone reference
    audio_temperature: 0.8
    audio_top_p: 0.95
    audio_top_k: 25
    audio_repetition_penalty: 1.2
    max_new_frames: 375
    voice_clone_max_text_tokens: 75

browser:
  default: zen
  automation: playwright

tools:
  enabled:
    # Core System
    - system
    - time
    - system_control
    - terminal
    # File Operations (MCP)
    - file_search
    - file_modify
    - mcp_filesystem
    # Web & Search
    - web
    - web_search
    - youtube
    # Communication
    - email
    - discord
    - telegram
    - whatsapp
    # Development
    - code
    - github
    - docker
    - mcp_github_mcp
    # Smart Home
    - homeassistant
    # Media & Entertainment
    - music
    - spotify
    - vlc
    # Productivity
    - calendar
    - notes
    - clipboard
    - screenshot
    - screentime
    # Memory & Knowledge
    - memory
    - mcp_memory
    - episodic_memory
    # MCP Servers
    - mcp
    - browser
    - mcp_browser
    - sequential_thinking
    - mcp_sequential_thinking
    - mcp_sqlite
    - mcp_search
    - mcp_exa
    - mcp_context7
    - mcp_fetch
    # Advanced Features
    - performance
    - agents
    - workflows
    - users
    - predictions
  require_approval:
    - system_settings

memory:
  vector_db: lancedb
  embedding_model: all-MiniLM-L6-v2
  db_path: ./data/vectors

security:
  offline_mode: false
  encrypt_memory: true
  terminal_whitelist:
    - ls
    - cat
    - grep
    - python

mcp:
  enabled: true
  auto_connect: true

  servers:
    filesystem:
      enabled: true
      command: npx
      args: ["-y", "@modelcontextprotocol/server-filesystem", "."]
      env: {}

    fetch:
      enabled: true
      command: uvx
      args: ["mcp-server-fetch"]
      env: {}

    github:
      enabled: true
      command: npx
      args: ["-y", "@modelcontextprotocol/server-github"]
      env:
        GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}

    sequentialthinking:
      enabled: true
      command: npx
      args: ["-y", "@modelcontextprotocol/server-sequential-thinking"]
      env: {}

    memory:
      enabled: true
      command: npx
      args: ["-y", "@modelcontextprotocol/server-memory"]
      env: {}

    sqlite:
      enabled: true
      command: uvx
      args: ["mcp-server-sqlite", "--db-path", "./data/jarvis.db"]
      env: {}

    redis:
      enabled: false
      command: npx
      args: ["-y", "@modelcontextprotocol/server-redis"]
      env:
        REDIS_URL: "redis://localhost:6379"

    playwright:
      enabled: true
      command: npx
      args:
        - "-y"
        - "@playwright/mcp@latest"
        - "--browser"
        - "firefox"
        - "--user-data-dir"
        - "C:\\Users\\Lalo\\AppData\\Roaming\\zen\\Profiles\\9zb7xjm1.Default (release)"
      env: {}

    context7:
      enabled: true
      command: npx
      args: ["-y", "@upstash/context7-mcp"]
      env: {}

    exa:
      enabled: true
      command: npx
      args: ["-y", "exa-mcp-server"]
      env:
        EXA_API_KEY: ${EXA_API_KEY}

    browserbase:
      enabled: false
      command: npx
      args: ["-y", "@browserbasehq/mcp-server-browserbase"]
      env:
        BROWSERBASE_API_KEY: ""
        BROWSERBASE_PROJECT_ID: ""
